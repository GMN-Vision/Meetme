# Merge this fragment into /etc/jitsi/jibri/jibri.conf on the recorder host,
# or include it from that file using its absolute installed path.
# Keep the existing XMPP, audio, HTTP API and recording-directory settings.
# Configure the X display to provide a 1920x1080 screen before restarting Jibri.
jibri.ffmpeg {
  resolution = "1920x1080"
  framerate = 30
  # Override Jibri's default level 3.1, which cannot describe 1080p30.
  video-params-recording = ${jibri.ffmpeg.video-params} [
    "-preset", ${jibri.ffmpeg.video-encode-preset-recording},
    "-profile:v", "main",
    "-level", "4.1",
    "-f", ${jibri.ffmpeg.recording-format}
  ]
}
